name: Build APK

on:
  workflow_dispatch:
    inputs:
      abi:
        description: "Архитектура телефона"
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - all
        default: arm64-v8a

env:
  APP_PACKAGE: com.myfork.gram

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Docker
        run: |
          docker build -t telegram-build .

      - name: Run Docker Build
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          ABI: ${{ inputs.abi }}
        run: |
          docker run --rm \
            -e TG_API_ID="$TG_API_ID" \
            -e TG_API_HASH="$TG_API_HASH" \
            -e APP_PACKAGE="$APP_PACKAGE" \
            -e ABI="$ABI" \
            -v "$PWD":/home/source \
            telegram-build

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: TMessagesProj/build/outputs/apk/**/*.apk
          retention-days: 5
